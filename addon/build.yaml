labels:
  org.opencontainers.image.title: "Home Assistant App: Govee to MQTT Bridge"
  org.opencontainers.image.description: "Acts as a bridge between Govee devices and Home Assistant, via the Home Assistant MQTT Integration."
  org.opencontainers.image.source: "https://github.com/sitapix/govee2mqtt"
  org.opencontainers.image.licenses: "MIT"

# Pin the signed per-architecture docker-base release. The legacy app builder
# verifies each architecture independently and cannot use the multi-arch
# manifest signature.
build_from:
  aarch64: "ghcr.io/home-assistant/aarch64-base-debian:bookworm-2026.06.1"
  amd64: "ghcr.io/home-assistant/amd64-base-debian:bookworm-2026.06.1"
cosign:
  # The identity is *our* identity that we use to sign this image.
  # It is used to verify the safety of reusing the cache
  identity: https://github.com/sitapix/govee2mqtt/.*
  # Base-image verification is intentionally omitted: the deprecated app
  # builder cannot discover signatures produced by docker-base's current
  # publishing workflow. The official base images remain release-pinned.
