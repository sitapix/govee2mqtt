labels:
  org.opencontainers.image.title: "Home Assistant App: Govee to MQTT Bridge"
  org.opencontainers.image.description: "Acts as a bridge between Govee devices and Home Assistant, via the Home Assistant MQTT Integration."
  org.opencontainers.image.source: "https://github.com/sitapix/govee2mqtt"
  org.opencontainers.image.licenses: "MIT"

# Pin the signed multi-architecture docker-base release. Home Assistant moved
# away from architecture-prefixed base images in docker-base 2026.03.1.
build_from:
  aarch64: "ghcr.io/home-assistant/base-debian:bookworm-2026.06.1"
  amd64: "ghcr.io/home-assistant/base-debian:bookworm-2026.06.1"
cosign:
  # The identity is *our* identity that we use to sign this image.
  # It is used to verify the safety of reusing the cache
  identity: https://github.com/sitapix/govee2mqtt/.*
  # The base_identity is the identity of the base images specified
  # by the build_from section above
  base_identity: https://github.com/home-assistant/docker-base/.*
